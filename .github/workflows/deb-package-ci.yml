name: Build and Install .deb Package

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

jobs:
  build-and-install-deb:
    runs-on: ubuntu-latest

    # Nastavení služby Grafana pro testování interakce s Grafana API
    services:
      grafana:
        image: grafana/grafana:latest
        ports:
          - 3000:3000
        env:
          GF_SECURITY_ADMIN_USER: admin
          GF_SECURITY_ADMIN_PASSWORD: password
          GF_AUTH_ANONYMOUS_ENABLED: true
          GF_AUTH_DISABLE_LOGIN_FORM: true
          # Instalace pluginu pomocí proměnné prostředí pro Docker kontejner
          GF_INSTALL_PLUGINS: frser-sqlite-datasource
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install build dependencies
      run: |
        sudo apt-get update
        # dpkg-dev, debhelper, devscripts pro sestavení .deb balíčku
        # python3-full, curl, jq, sqlite3, dbus, wget pro make install-test a interakci s Grafanou
        sudo apt-get install -y dpkg-dev debhelper devscripts python3-full curl jq sqlite3 dbus wget build-essential

    - name: Wait for Grafana server to be ready
      run: |
        echo "Waiting for Grafana server to be ready..."
        wget --no-verbose --tries=5 --retry-connrefused --waitretry=5 --output-file=/dev/null http://localhost:3000/api/health
        echo "Grafana is ready."

    - name: Generate and Set GRAFANA_API_KEY
      env:
        # Vytvoření API klíče v Grafaně pro CI test
        # To vyžaduje přihlašovací údaje administrátora, které jsou nastaveny ve službě Grafana
        # Používáme curl s basic auth, protože v CI nemáme uživatelskou interakci
        GF_USER: admin
        GF_PASS: password
      run: |
        AUTH_HEADER="Authorization: Basic $(echo -n "${{ env.GF_USER }}:${{ env.GF_PASS }}" | base64)"

        echo "Ověřuji přihlašovací údaje Grafana..."
        # Pokus o získání informací o uživateli pro ověření přihlašovacích údajů
        AUTH_CHECK_STATUS=$(curl -X GET -H "$AUTH_HEADER" -o /dev/null -w "%{http_code}\n" http://localhost:3000/api/user)

        if [ "$AUTH_CHECK_STATUS" -ne 200 ]; then
          echo "Chyba: Ověření přihlašovacích údajů Grafana selhalo. Stavový kód: $AUTH_CHECK_STATUS"
          echo "Ujistěte se, že GF_USER a GF_PASS jsou správné a mají administrátorská práva."
          exit 1
        fi
        echo "Přihlašovací údaje Grafana ověřeny."

        echo "Pokouším se vytvořit Service Account 'ci-test-service-account'..."
        # Vytvoření servisního účtu pomocí admin autentizace
        SERVICE_ACCOUNT_CREATE_RESPONSE=$(curl -v -X POST -H "Content-Type: application/json" -H "$AUTH_HEADER" -d '{"name":"ci-test-service-account", "role": "Admin", "is_disabled": false}' http://localhost:3000/api/serviceaccounts 2>&1)
        SERVICE_ACCOUNT_CREATE_EXIT_CODE=$?

        echo "Odpověď Grafana API pro vytvoření Service Accountu:"
        echo "$SERVICE_ACCOUNT_CREATE_RESPONSE"
        echo "Návratový kód curl: $SERVICE_ACCOUNT_CREATE_EXIT_CODE"

        if [ "$SERVICE_ACCOUNT_CREATE_EXIT_CODE" -ne 0 ]; then
          echo "Chyba: Vytvoření Service Accountu selhalo s kódem $SERVICE_ACCOUNT_CREATE_EXIT_CODE."
          exit 1
        fi

        SERVICE_ACCOUNT_JSON_BODY=$(echo "$SERVICE_ACCOUNT_CREATE_RESPONSE" | grep -m 1 -Eo '{.*}' || true)
        SERVICE_ACCOUNT_ID=$(echo "$SERVICE_ACCOUNT_JSON_BODY" | jq -r '.id' || true)

        if [ -z "$SERVICE_ACCOUNT_ID" ] || [ "$SERVICE_ACCOUNT_ID" = "null" ]; then
          echo "Chyba: Nepodařilo se získat ID Service Accountu."
          exit 1
        fi
        echo "Service Account 'ci-test-service-account' vytvořen s ID: $SERVICE_ACCOUNT_ID."

        echo "Generuji token pro Service Account ID $SERVICE_ACCOUNT_ID..."
        # Vytvoření tokenu pro nově vytvořený servisní účet
        SERVICE_ACCOUNT_TOKEN_RESPONSE=$(curl -v -X POST -H "Content-Type: application/json" -H "$AUTH_HEADER" -d '{"name":"ci-test-token"}' http://localhost:3000/api/serviceaccounts/$SERVICE_ACCOUNT_ID/tokens 2>&1)
        SERVICE_ACCOUNT_TOKEN_EXIT_CODE=$?

        echo "Odpověď Grafana API pro vytvoření tokenu:"
        echo "$SERVICE_ACCOUNT_TOKEN_RESPONSE"
        echo "Návratový kód curl: $SERVICE_ACCOUNT_TOKEN_EXIT_CODE"

        if [ "$SERVICE_ACCOUNT_TOKEN_EXIT_CODE" -ne 0 ]; then
          echo "Chyba: Vytvoření tokenu pro Service Account selhalo s kódem $SERVICE_ACCOUNT_TOKEN_EXIT_CODE."
          exit 1
        fi
        
        SERVICE_ACCOUNT_TOKEN_JSON_BODY=$(echo "$SERVICE_ACCOUNT_TOKEN_RESPONSE" | grep -m 1 -Eo '{.*}' || true)
        NEW_KEY=$(echo "$SERVICE_ACCOUNT_TOKEN_JSON_BODY" | jq -r '.key' || true)

        if [ -z "$NEW_KEY" ] || [ "$NEW_KEY" = "null" ]; then
          echo "Chyba: Nepodařilo se vygenerovat token pro Service Account (klíč nebyl nalezen ve výstupu JSON)."
          echo "Zkontrolujte log pro podrobný výstup curl a JSON odpověď."
          exit 1
        fi
        echo "GRAFANA_API_KEY=$NEW_KEY" >> $GITHUB_ENV
        echo "Grafana Service Account token vygenerován a nastaven jako GRAFANA_API_KEY."

    - name: Build .deb package
      run: |
        # Použijte dpkg-buildpackage k sestavení balíčku
        # -us, -uc zabraňuje podepisování balíčku (nepotřebné pro CI)
        # GRAFANA_API_KEY je nyní k dispozici v prostředí pro make install (volaný z debian/rules)
        dpkg-buildpackage -us -uc
      
    - name: Find and install .deb package
      run: |
        # Najděte vygenerovaný .deb soubor (název se může lišit verzí, architekturou atd.)
        DEB_FILE=$(find . -name "*.deb" -print -quit)
        if [ -z "$DEB_FILE" ]; then
          echo "Error: .deb package not found!"
          exit 1
        fi
        echo "Found .deb package: $DEB_FILE"
        sudo dpkg -i "$DEB_FILE"

    - name: Run make install-test
      env:
        GRAFANA_API_KEY: ${{ env.GRAFANA_API_KEY }}
        HOME: /tmp # Grafana CLI může ukládat soubory do HOME, což může v CI způsobit problémy s oprávněními
      run: |
        sudo make install-test
